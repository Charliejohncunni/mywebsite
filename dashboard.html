<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 2rem auto; line-height: 1.6; }
    h1 { color: #333; }
    #emails { margin-top: 2rem; }
    .email { margin-bottom: 1rem; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Personal Dashboard</h1>
  <p>Welcome! This area is protected and only accessible to authenticated users.</p>
  
  <div id="emails">
    <p>Loading emails...</p>
  </div>

  <script>
    async function loadEmails() {
      const resp = await fetch('/api/emails');
      const data = await resp.json();
      const container = document.getElementById('emails');
      if (data.error) {
        container.innerHTML = '<p>Error: ' + data.error + '</p>';
        return;
      }
      container.innerHTML = '';
      data.messages.forEach((msg, i) => {
        const div = document.createElement('div');
        div.className = 'email';
        div.innerHTML = '<strong>Message ' + (i+1) + '</strong> <br>' + (msg.snippet || 'No snippet');
        container.appendChild(div);
      });
    }
    loadEmails();
  </script>
</body>
</html>
